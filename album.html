<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Dokumentasi - PKL Bintang Menggala 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/min/base.min.css">
    <link rel="stylesheet" href="css/min/intro.min.css">
    <link rel="stylesheet" href="css/min/layout.min.css">
    <link rel="stylesheet" href="css/min/profile.min.css">
    <link rel="stylesheet" href="css/min/purpose.min.css">
    <link rel="stylesheet" href="css/min/gallery.min.css">
    <link rel="stylesheet" href="css/min/lightbox.min.css">
    <link rel="stylesheet" href="css/min/jurnal.min.css">
    
    <script src="page-init.js"></script>
</head>
<body>

    <header>
        <div class="container">
            <h1>ALBUM</h1>
            <p>Galeri Foto & Video PKL Bintang Menggala</p>
            
            <nav class="header-nav" aria-label="Navigasi utama">
                <a href="index.html" class="btn-nav">Halaman Utama</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <a href="story.html" class="btn-nav">Story</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <a href="jurnal.html" class="btn-nav">Jurnal</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h2 class="section-title">Semua Koleksi Media</h2>

            <div class="gallery-controls">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Cari foto/video (misal: Metro, Canvasing)...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Semua</button>
                    <button class="filter-btn" data-filter="OPHAR">OPHAR</button>
                    <button class="filter-btn" data-filter="Kegiatan pembelajaran">Kegiatan pembelajaran</button>
                </div>
            </div>

            <div class="gallery-grid" id="album-grid"></div>
        </section>
    </main>

    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-container">
            <span id="lightbox-close" class="lightbox-close">&times;</span>
            <img id="lightbox-img" class="lightbox-img" src="" alt="Fullscreen Image">
            <div class="lightbox-caption">
                <h3 id="lightbox-title"></h3>
                <p id="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <footer>
        <p class="footer-progress">Progress masih berjalan hingga 24/12/2026</p>
        <p>2026 Bintang Menggala</p>
    </footer>

    <script src="data-album.js"></script>
    <script src="script.js"></script>
</body>
</html>
