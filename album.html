<script>
function escHtml(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function escAttr(s){return escHtml(s).replace(/`/g,"&#96;");}
function safeMediaUrl(url){try{var u=new URL(String(url||"").trim(),location.href);if(u.protocol!=="https:")return"";var h=u.hostname.toLowerCase();if(h==="res.cloudinary.com"||h.endsWith(".cloudinary.com"))return u.href;return"";}catch(e){return"";}}
document.addEventListener("DOMContentLoaded",function(){
  if(typeof albumData==="undefined")return;
  var showcase=document.getElementById("album-showcase");
  var grid=document.getElementById("album-photo-grid");
  var videos=albumData.filter(function(i){return i.type==="video";});
  var photos=albumData.filter(function(i){return i.type!=="video";});

  if(showcase){
    var frag=document.createDocumentFragment();
    videos.forEach(function(item,a){
      var src=safeMediaUrl(item.src);
      if(!src)return;
      var s=document.createElement("article");
      s.className="showcase-item";
      var poster="";
      if(src.indexOf("cloudinary.com")!==-1){
        poster=src.split("#")[0].split("?")[0]
          .replace("/video/upload/","/video/upload/so_0,w_600,h_800,c_fill,f_jpg,q_auto/")
          .replace(/\.mp4$/i,".jpg");
      }
      var o='<div class="showcase-media"><video muted loop playsinline'+(poster?' poster="'+escAttr(poster)+'"':'')+' data-src="'+escAttr(src)+'"></video><div class="custom-play-btn"><div class="play-icon"></div></div></div>';
      s.innerHTML=o+'<div class="showcase-content"><div class="showcase-head"><h2 class="showcase-title">'+escHtml(item.title)+'</h2><button type="button" class="showcase-toggle" aria-expanded="false">Detail</button></div><div class="showcase-desc-wrapper"><div class="showcase-desc-inner"><p class="showcase-desc">'+escHtml(item.desc)+'</p></div></div></div>';
      frag.appendChild(s);
    });
    showcase.appendChild(frag);
  }

  if(grid){
    var gfrag=document.createDocumentFragment();
    photos.forEach(function(item,i){
      var src=safeMediaUrl(item.src);
      if(!src)return;
      var fig=document.createElement("figure");
      fig.className="album-grid-item";
      fig.innerHTML='<div class="album-grid-media"><img src="'+escAttr(src)+'" alt="'+escAttr(item.title)+'" loading="lazy" decoding="async" width="600" height="750"></div><figcaption class="album-grid-caption"><span class="album-grid-title">'+escHtml(item.title)+'</span><span class="album-grid-desc">'+escHtml(item.desc||'')+'</span></figcaption>';
      gfrag.appendChild(fig);
    });
    grid.appendChild(gfrag);
  }

  var items=document.querySelectorAll(".showcase-item");
  if("IntersectionObserver" in window){
    var obs=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting)entry.target.classList.add("is-visible");});},{rootMargin:"0px 0px -15% 0px",threshold:0.1});
    items.forEach(function(el){obs.observe(el);});
  }else{items.forEach(function(el){el.classList.add("is-visible");});}

  document.querySelectorAll(".showcase-toggle").forEach(function(btn){
    btn.addEventListener("click",function(){
      var item=this.closest(".showcase-item");
      var isExpanded=item.classList.contains("is-expanded");
      document.querySelectorAll(".showcase-item.is-expanded").forEach(function(el){
        el.classList.remove("is-expanded");
        el.querySelector(".showcase-toggle").setAttribute("aria-expanded","false");
      });
      item.classList.toggle("is-expanded",!isExpanded);
      this.setAttribute("aria-expanded",String(!isExpanded));
    });
  });

  var vids=document.querySelectorAll(".showcase-media video[data-src]");
  vids.forEach(function(v){
    if(v.getAttribute("poster")){
      var pre=new Image();
      pre.src=v.getAttribute("poster");
    }
  });
  if("IntersectionObserver" in window){
    var vObs=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var video=entry.target;
        if(entry.isIntersecting){
          if(!video.getAttribute("src")&&video.dataset.src){
            var safe=safeMediaUrl(video.dataset.src);
            if(!safe)return;
            video.src=safe;
            video.load();
            video.play().then(function(){video.parentElement.classList.add("playing");}).catch(function(){});
          }
        }else{
          video.pause();
          if(video.parentElement)video.parentElement.classList.remove("playing");
        }
      });
    },{threshold:0.25, rootMargin:"100px 0px"});
    vids.forEach(function(v){vObs.observe(v);});
  }else{
    vids.forEach(function(video){
      var safe=safeMediaUrl(video.dataset.src);
      if(safe){video.src=safe;video.load();}
    });
  }
  document.querySelectorAll(".showcase-media").forEach(function(media){
    var video=media.querySelector("video");
    if(video){
      media.addEventListener("click",function(ev){
        if(ev.target.closest(".custom-play-btn")||video.paused){
          video.play();
          media.classList.add("playing");
        }else{
          video.pause();
          media.classList.remove("playing");
        }
      });
    }
  });
});
</script>
