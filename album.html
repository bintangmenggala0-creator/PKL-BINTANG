<script>
document.addEventListener("DOMContentLoaded", () => {
    const e = document.getElementById("album-showcase");
    if (!e || typeof albumData === "undefined") return;

    const t = document.createDocumentFragment();
    albumData.forEach((item, a) => {
        const s = document.createElement("article");
        s.className = "showcase-item";
        let o = "";
        if (item.type === "video") {
            const poster = item.src.includes("cloudinary.com")
                ? item.src.split("#")[0].split("?")[0].replace(/\.[^/.]+$/, ".jpg").replace("/upload/", "/upload/so_1.0,f_auto,q_auto/")
                : null;
            o = `<div class="showcase-media"><video muted loop playsinline ${poster ? `poster="${poster}"` : ""} data-src="${item.src}" onloadeddata="this.classList.add('is-loaded')"></video><div class="custom-play-btn"><div class="play-icon"></div></div></div>`;
        } else {
            o = a === 0
                ? `<div class="showcase-media"><img src="${item.src}" alt="${item.title}" fetchpriority="high" decoding="async" onload="this.classList.add('is-loaded')"></div>`
                : `<div class="showcase-media"><img src="${item.src}" alt="${item.title}" loading="lazy" decoding="async" onload="this.classList.add('is-loaded')"></div>`;
        }
        s.innerHTML = `${o}<div class="showcase-content"><h2 class="showcase-title">${item.title}</h2><button class="showcase-toggle" aria-expanded="false">Detail</button><div class="showcase-desc-wrapper"><div class="showcase-desc-inner"><p class="showcase-desc">${item.desc}</p></div></div></div>`;
        t.appendChild(s);
    });
    e.appendChild(t);

    const items = document.querySelectorAll(".showcase-item");
    if ("IntersectionObserver" in window) {
        const obs = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) entry.target.classList.add("is-visible");
            });
        }, { rootMargin: "0px 0px -15% 0px", threshold: 0.1 });
        items.forEach((el) => obs.observe(el));
    } else {
        items.forEach((el) => el.classList.add("is-visible"));
    }

    document.querySelectorAll(".showcase-toggle").forEach((btn) => {
        btn.addEventListener("click", function () {
            const item = this.closest(".showcase-item");
            const isExpanded = item.classList.contains("is-expanded");
            document.querySelectorAll(".showcase-item.is-expanded").forEach((el) => {
                el.classList.remove("is-expanded");
                el.querySelector(".showcase-toggle").setAttribute("aria-expanded", "false");
            });
            item.classList.toggle("is-expanded", !isExpanded);
            this.setAttribute("aria-expanded", String(!isExpanded));
        });
    });

    const videos = document.querySelectorAll(".showcase-media video[data-src]");
    if ("IntersectionObserver" in window) {
        const vObs = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const video = entry.target;
                    if (!video.querySelector("source")) {
                        video.src = video.dataset.src;
                        video.load();
                        video.play().then(() => {
                            video.parentElement.classList.add("playing");
                        }).catch(() => {});
                    }
                } else {
                    entry.target.pause();
                    entry.target.parentElement.classList.remove("playing");
                }
            });
        }, { threshold: 0.5 });
        videos.forEach((v) => vObs.observe(v));
    }

    document.querySelectorAll(".showcase-media").forEach((media) => {
        const video = media.querySelector("video");
        if (video) {
            media.addEventListener("click", (ev) => {
                if (ev.target.closest(".custom-play-btn") || video.paused) {
                    video.play();
                    media.classList.add("playing");
                } else {
                    video.pause();
                    media.classList.remove("playing");
                }
            });
        }
    });
});
</script>
