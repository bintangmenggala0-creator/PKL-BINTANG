<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/min/base.min.css">
    <link rel="stylesheet" href="css/min/layout.min.css">
    <link rel="stylesheet" href="css/min/intro.min.css">
    <link rel="stylesheet" href="css/min/gallery.min.css">

</head>
<body>

    <div id="intro-screen" class="intro-logo-screen intro-active">
        <div class="css-logo-wrapper">
            <span class="logo-base">7</span>
        </div>
    </div>

    <header>
        <div class="container">
            <h1>ALBUM</h1>
            <p>Momen Eksklusif Bintang Menggala</p>
            
            <nav class="header-nav" aria-label="Navigasi utama">
                <a href="index.html" class="btn-nav">Halaman Utama</a>

    <main class="container">
        <section class="showcase-section">
            <div class="showcase-container" id="album-showcase">
                <!-- Konten di-generate lewat Javascript -->
            </div>
        </section>
    </main>

    <footer>
        <p class="footer-progress">Progress masih berjalan hingga 24/12/2026</p>
        <p>2026 Bintang Menggala</p>
    </footer>

    <script src="data-album.js"></script>
    <script src="script.js"></script>
    <script>document.addEventListener("DOMContentLoaded",()=>{const e=document.getElementById("album-showcase");if(!e||"undefined"==typeof albumData)return;const t=document.createDocumentFragment();albumData.forEach(((e,a)=>{const s=document.createElement("article");s.className="showcase-item";let o="";if("video"===e.type){const t=e.src.includes("cloudinary.com")?e.src.split("#")[0].split("?")[0].replace(/\.[^/.]+$/,".jpg").replace("/upload/","/upload/so_1.0,f_auto,q_auto/"):null;o=`<div class="showcase-media"><video muted loop playsinline ${t?`poster="${t}"`:""} data-src="${e.src}" onloadeddata="this.classList.add('is-loaded')"></video><div class="custom-play-btn"><div class="play-icon"></div></div></div>`}else o=0===a?`<div class="showcase-media"><img src="${e.src}" alt="${e.title}" fetchpriority="high" decoding="async" onload="this.classList.add('is-loaded')"></div>`:`<div class="showcase-media"><img src="${e.src}" alt="${e.title}" loading="lazy" decoding="async" onload="this.classList.add('is-loaded')"></div>`;s.innerHTML=`${o}<div class="showcase-content"><h2 class="showcase-title">${e.title}</h2><button class="showcase-toggle" aria-expanded="false">Detail</button><div class="showcase-desc-wrapper"><div class="showcase-desc-inner"><p class="showcase-desc">${e.desc}</p></div></div></div>`,t.appendChild(s)})),e.appendChild(t);const a=document.querySelectorAll(".showcase-item");if("IntersectionObserver"in window){const e=new IntersectionObserver((e=>{e.forEach((e=>{e.isIntersecting&&e.target.classList.add("is-visible")}))}),{rootMargin:"0px 0px -15% 0px",threshold:.1});a.forEach((t=>e.observe(t)))}else a.forEach((e=>e.classList.add("is-visible")));document.querySelectorAll(".showcase-toggle").forEach((e=>{e.addEventListener("click",function(){const e=this.closest(".showcase-item"),t=e.classList.contains("is-expanded");document.querySelectorAll(".showcase-item.is-expanded").forEach((e=>{e.classList.remove("is-expanded"),e.querySelector(".showcase-toggle").setAttribute("aria-expanded","false")})),e.classList.toggle("is-expanded",!t),this.setAttribute("aria-expanded",!t)})}));const s=document.querySelectorAll(".showcase-media video[data-src]");if("IntersectionObserver"in window){const e=new IntersectionObserver((e=>{e.forEach((e=>{if(e.isIntersecting){const t=e.target;t.querySelector("source")||(t.src=t.dataset.src,t.load(),t.play().then((()=>{t.parentElement.classList.add("playing")})).catch((()=>{})))}else e.target.pause(),e.target.parentElement.classList.remove("playing")}))}),{threshold:.5});s.forEach((t=>e.observe(t)))}document.querySelectorAll(".showcase-media").forEach((e=>{const t=e.querySelector("video");t&&e.addEventListener("click",(a=>{a.target.closest(".custom-play-btn")||t.paused?(t.play(),e.classList.add("playing")):(t.pause(),e.classList.remove("playing"))}))}))});</script>
</body>
</html>
