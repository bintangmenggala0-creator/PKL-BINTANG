<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal - PKL Bintang Menggala 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/min/base.min.css">
    <link rel="stylesheet" href="css/min/intro.min.css">
    <link rel="stylesheet" href="css/min/layout.min.css">
    <link rel="stylesheet" href="css/min/profile.min.css">
    <link rel="stylesheet" href="css/min/purpose.min.css">
    <link rel="stylesheet" href="css/min/gallery.min.css">
    <link rel="stylesheet" href="css/min/lightbox.min.css">
    <link rel="stylesheet" href="css/min/jurnal.min.css">
    <script src="page-init.js"></script>
</head>
<body>

    <header>
        <div class="container">
            <h1>JURNAL</h1>
            <p>Bintang Menggala - PT PLN Icon Plus KP. Lampung</p>
            
            <nav class="header-nav" aria-label="Navigasi utama">
                <a href="index.html" class="btn-nav">Halaman Utama</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <a href="story.html" class="btn-nav">Story</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <a href="album.html" class="btn-nav">Album</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h2 class="section-title">Catatan Kegiatan</h2>

            <div class="gallery-controls">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Cari tanggal atau deskripsi kegiatan...">
                </div>
            </div>

            <div class="jurnal-index" id="jurnal-index"></div>

            <div class="jurnal-timeline" id="jurnal-grid">
                <div class="jurnal-loader">
                    <div class="jurnal-card skeleton-card">
                        <div class="card-content">
                            <div class="skeleton-tag"></div>
                            <div class="skeleton-title"></div>
                            <div class="skeleton-desc"></div>
                            <div class="skeleton-desc short"></div>
                        </div>
                    </div>
                    <div class="jurnal-card skeleton-card">
                        <div class="card-content">
                            <div class="skeleton-tag" style="width: 25%"></div>
                            <div class="skeleton-title" style="width: 55%"></div>
                            <div class="skeleton-desc"></div>
                        </div>
                    </div>
                    <div class="jurnal-card skeleton-card">
                        <div class="card-content">
                            <div class="skeleton-tag" style="width: 40%"></div>
                            <div class="skeleton-title" style="width: 75%"></div>
                            <div class="skeleton-desc"></div>
                            <div class="skeleton-desc" style="width: 85%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p class="footer-progress">Progress masih berjalan hingga 24/12/2026</p>
        <p>2026 Bintang Menggala - SMKN 7.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
